---
name: Molecule
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  schedule:
    - cron: '29 21 * * 0'

jobs:

  list-scenarios:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.listscenarios.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4
      - id: listscenarios
        uses: ome/action-ansible-molecule-list-scenarios@main

  test:
    name: Test
    needs:
      - list-scenarios
    runs-on: ubuntu-24.04
    strategy:
      # Keep running so we can see if other tests pass
      fail-fast: false
      matrix:
        scenario: ${{fromJson(needs.list-scenarios.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Ansible & Molecule
        run: |
            pip install "ansible" "ansible-lint" flake8
            pip install "molecule" "ansible-compat"
            pip install molecule-plugins[docker] pytest-testinfra
      - name: Run molecule
        run: molecule test -s "${{ matrix.scenario }}"

  publish:
    name: Galaxy
    #if: startsWith(github.ref, 'refs/tags')
    needs:
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core

      - name: Verify Python and Ansible
        run: |
          python --version
          python -m pip install ansible-core
          ansible --version
          python -c "import sys; print(sys.executable)"

      - name: Test for Dataclasses AttributeError
        run: |
          echo "=== VERIFYING PYTHON RUNTIME COMPATIBILITY ==="
          python -c "from ansible.cli.galaxy import main; print('Success: Ansible Galaxy module loaded without errors.')"

      - name: Dry Run Test (PR Protection)
        if: github.event_name == 'pull_request'
        run: |
          echo "=== PR RUN: SIMULATING PUBLISH ==="
          echo "Command to deploy on merge: ansible-galaxy role import --api-key SECRET_KEY --branch ${{ github.head_ref }} ${{ github.repository_owner }} ${{ github.event.repository.name }}"
